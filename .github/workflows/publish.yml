# Builds the image and publishes it so Vast can pull it.
#
# - Always pushes to GitHub Container Registry: ghcr.io/<your-github-user>/hiveos-vast
#   (make the package public once: GitHub > your profile > Packages > hiveos-vast >
#   Package settings > Change visibility > Public).
# - Also pushes to Docker Hub if you add two repository secrets:
#   DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Settings > Secrets and variables > Actions).
#
# Tags: latest, and the HiveOS client version (e.g. 0.6-231).
# Runs on every push to main, weekly (to pick up new HiveOS releases), or by hand.
name: Publish image

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: hiveos-vast
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Find the newest HiveOS client version
        id: hive
        run: |
          set -euo pipefail
          version=$(curl -fsSL https://download.hiveos.farm/repo/binary/Packages.gz | gunzip \
            | awk -v RS= '/^Package: hive\n/' | grep -oP '^Version: \K\S+' | sort -V | tail -n1)
          test -n "$version"
          echo "HiveOS client: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Work out image tags
        id: tags
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          v="${{ steps.hive.outputs.version }}"
          tags="ghcr.io/$owner/$IMAGE_NAME:latest,ghcr.io/$owner/$IMAGE_NAME:$v"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            tags="$tags,$DOCKERHUB_USERNAME/$IMAGE_NAME:latest,$DOCKERHUB_USERNAME/$IMAGE_NAME:$v"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: HIVE_VERSION=${{ steps.hive.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.hive.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
